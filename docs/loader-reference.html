/* top tilted emblem – keeps same tilted feel, only slow rotation */
.top-emblem{
  position:absolute;
  top:-7vh;
  left:50%;
  width:min(72vw,430px);
  transform:translateX(-50%) rotate(-9deg);
  transform-origin:50% 50%;
  opacity:.96;
  animation:slowSpin 18s linear infinite;
  filter:drop-shadow(0 10px 20px rgba(31,81,125,.12));
  pointer-events:none;
  user-select:none;
}

@keyframes slowSpin{
  0%{transform:translateX(-50%) rotate(-9deg)}
  100%{transform:translateX(-50%) rotate(351deg)}
}

/* center logo – no float, no rings */
.center-stage{
  position:relative;
  width:210px;
  height:210px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.center-logo{
  width:132px;
  height:132px;
  object-fit:contain;
  opacity:0;
  transform:scale(.55) rotate(-7deg);
  animation:centerReveal 1.1s cubic-bezier(.2,.85,.25,1.15) .25s forwards,
            centerPulse 2.6s ease-in-out 1.45s infinite;
  filter:drop-shadow(0 10px 28px rgba(61,57,145,.20));
}

/* subtle halo only, not a ring */
.center-glow{
  position:absolute;
  width:175px;
  height:175px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.78) 0%,rgba(255,255,255,.36) 42%,rgba(255,255,255,0) 72%);
  opacity:0;
  animation:glowIn .9s ease .45s forwards,glowBreath 2.6s ease-in-out 1.45s infinite;
}

@keyframes centerReveal{
  0%{opacity:0;transform:scale(.55) rotate(-7deg)}
  65%{opacity:1;transform:scale(1.08) rotate(2deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}
@keyframes centerPulse{
  0%,100%{transform:scale(1) rotate(0)}
  50%{transform:scale(1.055) rotate(0)}
}
@keyframes glowIn{to{opacity:1}}
@keyframes glowBreath{
  0%,100%{transform:scale(.96);opacity:.72}
  50%{transform:scale(1.05);opacity:1}
}

/* premium shine sweep clipped to round logo */
.shine-mask{
  position:absolute;
  width:132px;
  height:132px;
  border-radius:50%;
  overflow:hidden;
  opacity:0;
  animation:shineMaskIn .2s linear 1.3s forwards;
  pointer-events:none;
}
.shine-mask::after{
  content:"";
  position:absolute;
  top:-25%;
  left:-70%;
  width:30%;
  height:150%;
  transform:rotate(18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.72),transparent);
  animation:shineSweep 2.4s ease-in-out 1.4s infinite;
}
@keyframes shineMaskIn{to{opacity:1}}
@keyframes shineSweep{
  0%{left:-70%}
  50%,100%{left:150%}
}

/* responsive: keep animated logo exactly in the middle */
.center-stage{transform:none;}
@media(max-width:768px){
  .center-stage{width:195px;height:195px;transform:none;}
  .center-logo,.shine-mask{width:124px;height:124px;}
  .center-glow{width:162px;height:162px;}
}
@media(max-width:480px){
  .center-stage{width:175px;height:175px;transform:none;}
  .center-logo,.shine-mask{width:108px;height:108px;}
  .center-glow{width:145px;height:145px;}
}
@media(max-width:360px){
  .center-stage{width:160px;height:160px;transform:none;}
  .center-logo,.shine-mask{width:100px;height:100px;}
  .center-glow{width:136px;height:136px;}
}
@media(max-height:560px){
  .center-stage{width:145px;height:145px;transform:none;}
  .center-logo,.shine-mask{width:92px;height:92px;}
  .center-glow{width:125px;height:125px;}
}
</style>
</head>
