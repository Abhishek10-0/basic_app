services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sme
      POSTGRES_PASSWORD: sme_local_dev
      POSTGRES_DB: sme_chamber_utf8
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sme_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sme -d sme_chamber"]
      interval: 5s
      retries: 10
volumes:
  sme_postgres:
